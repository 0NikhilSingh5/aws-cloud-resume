name: Deploy to S3
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Build static site
      working-directory: web
      run: npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    # --exclude "apps/*" is load-bearing, not tidiness. apps.codenickk.com is served from the
    # apps/ prefix of THIS bucket, and has to be: that host shares the distribution's default
    # cache behaviour with the apex, and a behaviour has exactly one origin. The resume build
    # knows nothing about apps/, so --delete treated the whole prefix as a stray and removed it.
    # That took the app index down twice on 2026-07-27 and the bucket has no versioning to
    # restore from. Its source is the codenickk-apps repo.
    - name: Sync build output to S3
      run: |
        aws s3 sync web/out/ s3://nikhilsresumebucket --delete \
          --exclude "__next.*" \
          --exclude "apps/*"

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id E1PNSO5QUYT69 \
          --paths "/*"
