name: Deploy to S3
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Build static site
      working-directory: web
      run: npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    # The prefix excludes are load-bearing, not tidiness. apps.codenickk.com and
    # fuelmeter.codenickk.com are served from prefixes of THIS bucket, and have to be: those
    # hosts share the distribution's default cache behaviour with the apex, and a behaviour has
    # exactly one origin. The resume build knows nothing about the prefixes, so --delete treats
    # each one as a stray and removes it. That took the app index down twice on 2026-07-27 and
    # the fuelmeter app down on 2026-08-01, both with versioning off. Versioning is on since
    # 2026-08-03 (noncurrent versions expire after 30 days) — a recovery net, not a reason to
    # drop an exclude. Every new <app>/ prefix in this bucket needs one here BEFORE its first
    # deploy. Sources: the codenickk-apps and fuel-meter repos.
    - name: Sync build output to S3
      run: |
        aws s3 sync web/out/ s3://nikhilsresumebucket --delete \
          --exclude "__next.*" \
          --exclude "apps/*" \
          --exclude "fuelmeter/*"

    - name: Invalidate CloudFront cache and wait for it
      run: |
        ID=$(aws cloudfront create-invalidation \
          --distribution-id E1PNSO5QUYT69 \
          --paths "/*" \
          --query Invalidation.Id --output text)
        aws cloudfront wait invalidation-completed \
          --distribution-id E1PNSO5QUYT69 --id "$ID"

    # The 2026-07-27 and 2026-08-01 wipes both shipped green: sync ok, invalidation ok, site
    # gone. So a deploy is not done until every host on the distribution demonstrably serves
    # its own site. The marker is each page's <title>: a wiped prefix 403s (caught by curl -f),
    # and a wrong-site regression fails the marker — a status check alone is not enough because
    # unknown paths serve a soft 404 at HTTP 200 by design. Markers live in each app's repo;
    # renaming a title means updating it here.
    - name: Verify every host on the distribution
      run: |
        check() {
          body=$(curl -fsS --max-time 20 "$1") \
            || { echo "FAIL $1: unreachable or not 200"; exit 1; }
          printf '%s' "$body" | grep -q "$2" \
            || { echo "FAIL $1: marker $2 missing - wrong site served"; exit 1; }
          echo "ok $1"
        }
        check https://codenickk.com/           'Cloud Engineer'
        check https://apps.codenickk.com/      '<title>Apps'
        check https://fuelmeter.codenickk.com/ '<title>fuelmeter'
        code=$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' https://resume.codenickk.com/)
        [ "$code" = "301" ] || { echo "FAIL resume.codenickk.com: expected 301, got $code"; exit 1; }
        echo "ok resume.codenickk.com (301)"
